name: qa
# Encrypted test builds only. Each build is decrypted inside the runner, tested, and every output (screenshots,
# videos, logs) is encrypted again before upload. The public log shows test names and PASS / FAIL only.
on:
  push:
    branches: [main]
    paths: ["build/**", "ci/**", ".github/workflows/qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tag: linux
          - os: macos-15
            tag: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          K: ${{ secrets.GUTTERTOWN_KEY }}
          P: ${{ secrets.GUTTERTOWN_PRIVATE_TOKEN }}
        run: |
          [ -n "$K" ] || { echo "GUTTERTOWN_KEY secret is missing"; exit 1; }
          [ -n "$P" ] || echo "GUTTERTOWN_PRIVATE_TOKEN secret is missing (results will only be uploaded encrypted)"
      - name: Runner setup
        run: bash ci/setup.sh ${{ matrix.tag }}
      - name: Decrypt build
        env:
          GUTTERTOWN_KEY: ${{ secrets.GUTTERTOWN_KEY }}
        run: bash ci/decrypt_build.sh ${{ matrix.tag }}
      - name: Run tests
        run: bash ci/run_tests.sh ${{ matrix.tag }}
      - name: Encrypt results
        if: always()
        run: bash ci/encrypt_results.sh ${{ matrix.tag }}
      - name: Upload encrypted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guttertown-results-${{ matrix.tag }}-${{ github.run_number }}
          path: results-${{ matrix.tag }}.p7m
          retention-days: 1
          if-no-files-found: ignore
      - name: Copy results to the private repo
        if: always()
        env:
          GUTTERTOWN_PRIVATE_TOKEN: ${{ secrets.GUTTERTOWN_PRIVATE_TOKEN }}
        run: bash ci/push_private.sh ${{ matrix.tag }} ${{ github.run_number }}
      - name: Wipe
        if: always()
        run: rm -rf ./work ./out ./results-*.p7m ./results-*.tgz
      - name: Result
        run: bash ci/status.sh

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          K: ${{ secrets.GUTTERTOWN_KEY }}
        run: '[ -n "$K" ] || { echo "GUTTERTOWN_KEY secret is missing"; exit 1; }'
      - name: Runner setup
        run: bash ci/setup.sh android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules >/dev/null 2>&1
          sudo udevadm trigger --name-match=kvm >/dev/null 2>&1
      - name: Decrypt build
        env:
          GUTTERTOWN_KEY: ${{ secrets.GUTTERTOWN_KEY }}
        run: bash ci/decrypt_build.sh android
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/run_android.sh
      - name: Encrypt results
        if: always()
        run: bash ci/encrypt_results.sh android
      - name: Upload encrypted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guttertown-results-android-${{ github.run_number }}
          path: results-android.p7m
          retention-days: 1
          if-no-files-found: ignore
      - name: Copy results to the private repo
        if: always()
        env:
          GUTTERTOWN_PRIVATE_TOKEN: ${{ secrets.GUTTERTOWN_PRIVATE_TOKEN }}
        run: bash ci/push_private.sh android ${{ github.run_number }}
      - name: Wipe
        if: always()
        run: rm -rf ./work ./out ./results-*.p7m ./results-*.tgz
      - name: Result
        run: bash ci/status.sh
